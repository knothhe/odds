name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing version tag to resume (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact tag and clean source
        id: version
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/macos.py verify-tag --tag "$RELEASE_TAG"
          python3 -c 'import json,os; value=json.load(open("mygo.json"))["version"]; open(os.environ["GITHUB_OUTPUT"],"a").write("value="+value+"\n")'
      - name: Check the tagged source
        run: make check
      - name: Build fixed-signed app, DMG and signed full update
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python3 scripts/ci-sign.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odds-${{ inputs.tag || github.ref_name }}-darwin-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/release/darwin-arm64/odds-${{ steps.version.outputs.value }}-arm64.dmg
            dist/release/darwin-arm64/odds-${{ steps.version.outputs.value }}-darwin-arm64.tar.gz
            dist/release/darwin-arm64/update-darwin-arm64.json
            dist/release/darwin-arm64/SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: odds-${{ inputs.tag || github.ref_name }}-darwin-arm64
          path: dist/release/darwin-arm64
      - name: Reverify and publish the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
