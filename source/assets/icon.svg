<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- odds app icon. Body on the macOS icon grid: 824 × 824 at 100, 100. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7471FA"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Crosshair: a ring with ticks outside it -->
  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round">
    <circle cx="512" cy="512" r="220"/>
    <path d="M512 212 V262 M512 762 V812 M212 512 H262 M762 512 H812"/>
  </g>

  <!-- The pointer, its tip on the center -->
  <path transform="translate(512 512) scale(0.7)"
        d="M0 0 V196 L50 150 L86 232 L124 215 L88 136 H156 Z"
        fill="#FFFFFF" stroke="#4F46E5" stroke-width="22" stroke-linejoin="round"/>
</svg>
